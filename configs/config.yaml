target_url: https://www.bbc.co.uk/news/science-environment-67962397#comments

site:
  bbc_site:
    comments_closed: '//p[@class="comments__message comments__message--closed-forum"]'
    more_comments_button: '//button[@class="comments-button comments__more-comments-button"]'
    more_replies_button: '//button[@class="reply-more-replies__button"]'
    more_replies_text: '//button[@class="reply-more-replies__button"]/span[@class="reply-more-replies__text"]'
    button_text: 'Check for new replies'
    comment_contents: 'comment__content'

  data_selectors:
      - {'class': 'comment__text'}
      - {'class': 'posted-date comment__posted-date'}
      - {'class': 'comment-rating__button-number'}
      - {'class': 'comment__down-ratings'}

  df_columns:
    - 'Comment'
    - 'Post Date'
    - 'Likes'
    - 'Dislikes'

ChromeOptions:
#    - --headless

WebDriverWait:
  timeout: !!float 2.0
  poll_frequency: !!float 0.5
  ignored_exceptions: !!null