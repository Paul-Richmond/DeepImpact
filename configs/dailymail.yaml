dm_cfg1:
  accept_cookies_selector:
    name: Accept
    role: button
  reorder_comments_first: true
  comments_order_selector:
    name: Oldest
    role: button
  page_buttons_selector:
    id: li
  more_comments_selectors:
  - label: !!python/object/apply:re._compile
    - 'Show more(?:\s+comments)?'
    - 32
  - label: !!python/object/apply:re._compile
    - '(?:Show more|See all)\s+replies'
    - 32
  - text: See more
  comments_container_selector:
    id: '#reader-comments'


