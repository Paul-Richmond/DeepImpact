handler: !Cls
  module: scrapers
  name: DailyMail
site:
  cookies: 
      window: '//button[@class="button_cVc76 basic_PnsIU"]'
      reject_all: '//*[@id="sciencetech"]/div[5]/div/div/div/div[3]/div/div[4]/button[1]'
      save_and_exit: '//*[@id="sciencetech"]/div[5]/div/div/div/div[4]/button[2]'
  
  control:
    shadow_root: '//div[@id="reader-comments"]/div/*[1]' 
    more_comments_button: 'spcv_load-more-messages'
    show_more_replies: 'spcv_showMoreRepliesText'
    see_more: 'components-MessageLayout-index__messageWrapper'
    
  main_container: 'spcv_conversation'
  data_container: {"name": "div", "class_": "components-MessageLayout-index__message-view"}

  data_selectors:
    - {"name": "div", "data-spot-im-class": "message-text"}
    - {"name": "time"}
    - {"name": "button", "aria-label": "Vote Up"}
    - {"name": "button", "aria-label": "Vote Down"}
    - {"name": "span", "data-spot-im-class": "message-username"}
    - {"name": "span", "class_": "Typography__text--11-5-2 Typography__t5--11-5-2 Typography__l5--11-5-2"}

  df_columns:
    - 'Comment'
    - 'Post Date'
    - 'Up Votes'
    - 'Down Votes'
    - 'Username'
    - 'Location'
