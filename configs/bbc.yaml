# BBC News Website Scraping Configurations
#
# This configuration file contains defines selectors used by the class DefaultScraper to scrape comments
# from BBC website articles. It works in conjunction with the scraper implementation in
# scrapers/sites/default.py and the configuration system defined in scrapers/config.py.
#
# The configuration is loaded via the load_site_config() function from scrapers/config.py and
# converted to a SiteConfig object with proper selector configurations.
#
# For information about selector types and configuration options, see the SelectorConfig
# class in scrapers/config.py.
#
# The selector names e.g. `accept_cookies_selector` must match attributes in the SiteConfig class
# in scrapers/config.py

bbc_cfg0:  # must match entry in database field `scraping_config`
  accept_cookies_selector:
    test_id: accept-button
  expose_initial_comments_selector:
    label: !!python/object/apply:re._compile
      - 'View comments'
      - 34 # 34 means use re.IGNORECASE
  more_comments_selectors: # this needs to be a list of selectors, see SiteConfig type hints
  - role: button
    name: More comments
  - role: button
    name: !!python/object/apply:re._compile
      - 'More replies \(\d+\)'
      - 34
  comments_container_selector:  # this is the element whose html gets grabbed
    test_id: 'comments-container'

