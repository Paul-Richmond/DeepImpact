[ENV]
CHROMEDRIVER_PATH = /Users/paul/miniconda3/envs/DeepImpact/bin/chromedriver

[CHROME]
headless = --headless

[BBC_SITE]
target_url = https://www.bbc.co.uk/sport/cricket/68128995
wait_time = 2.0
# Selenium can accept xpaths
comments_button = //button[@class='view-comments-button']
more_comments_button = //button[@class='comments-button comments__more-comments-button']
more_replies_button = //button[@class='reply-more-replies__button']
# BeautifulSoup cannot handle xpaths so we use class names instead
comment_contents = comment__content

[DATA]
comments_text = {'class': 'comment__text'}
post_date = {'class': 'posted-date comment__posted-date'}
up_rating = {'class': 'comment-rating__button-number'}
down_rating = {'class': 'comment__down-ratings'}